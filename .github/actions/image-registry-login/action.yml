name: Authenticate image registry
description: Authenticate ECR or GHCR without building an image
inputs:
  registry_type:
    description: "ecr or ghcr"
    required: true
  ecr_region:
    description: "AWS region for ECR"
    required: false
  aws_role_arn:
    description: "AWS role for ECR"
    required: false
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      if: inputs.registry_type == 'ecr'
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.ecr_region }}
    - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      if: inputs.registry_type == 'ecr'
    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      if: inputs.registry_type == 'ghcr' && github.event_name != 'pull_request'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
