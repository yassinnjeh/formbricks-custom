name: Linear Release Sync

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linear-release:
    name: Sync release to Linear
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sync Linear release
        uses: linear/linear-release-action@cfd42077dccdc0c26a38589934e2aa11046f57b7 # v0.18.3
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
